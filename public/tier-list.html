        .tier-list-container {
            max-width: 1000px;

            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .tier-row {
            display: flex;
            min-height: 100px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .tier-row:last-child {
            border-bottom: none;
        }
        
        .tier-label {
            width: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: 900;
            color: #111;
            text-shadow: 0px 1px 1px rgba(255,255,255,0.4);
        }
        .tier-label.s { background-color: #ff7f7f; }
        .tier-label.a { background-color: #ffbf7f; }
        .tier-label.b { background-color: #ffff7f; }
        .tier-label.c { background-color: #7fff7f; }
        .tier-label.d { background-color: #7fbfff; }
        
        .tier-dropzone {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            min-height: 100px;
        }
        
        .hero-icon {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.2);
            cursor: grab;
            transition: transform 0.1s;
            user-select: none;
            background: #222;
        }
        .hero-icon:active {
            cursor: grabbing;
        }
        .hero-icon:hover {
            border-color: #aef649;
            transform: scale(1.05);
        }
        .hero-icon.sortable-ghost {
            opacity: 0.4;
            transform: scale(0.95);
        }
        
        .save-btn-container {
            text-align: center;
            margin-bottom: 40px;
        }
        .save-btn {
            background: linear-gradient(135deg, #aef649, #8bd032);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(174, 246, 73, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(174, 246, 73, 0.6);
        }
        .save-btn:active {
            transform: translateY(1px);
        }
        
        .hero-pool-container {
            max-width: 1000px;
            margin: 0 auto 60px auto;
            text-align: center;
        }

            gap: 15px;

            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            min-height: 150px;
            justify-content: center;

    <script>
        // SortableJS Initialization for Drag and Drop
        document.addEventListener('DOMContentLoaded', () => {
            const dropzones = document.querySelectorAll('.tier-dropzone, .hero-pool');
            
            dropzones.forEach(zone => {
                new Sortable(zone, {
                    group: 'shared', // set both lists to same group so items can move between them
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    easing: "cubic-bezier(1, 0, 0, 1)"
                });
            });
        });

        // Navigation and Auth Logic
        document.addEventListener('click', (e) => {
            const container = document.querySelector('.lang-menu-container');
            const menu = document.getElementById('lang-dropdown');
            if (container && menu && !container.contains(e.target)) {
                menu.style.display = 'none';
            }
        });
        
        function selectLanguage(element, langCode) {
            const btn = element.closest('.lang-menu-container').querySelector('.nav-icon-btn');
            btn.innerHTML = langCode + ' <span style="font-size: 1.2em; margin-top: -2px;">🌐</span>';
            const options = element.parentElement.querySelectorAll('.lang-option');
            options.forEach(opt => opt.classList.remove('active'));
            element.classList.add('active');
            localStorage.setItem('selectedLang', langCode);
            element.parentElement.style.display = 'none';
            if (window.applyTranslations) window.applyTranslations(langCode);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('selectedLang') || 'EN';
            const option = Array.from(document.querySelectorAll('.lang-option')).find(o => o.textContent.includes(savedLang));
            if (option) {
                selectLanguage(option, savedLang);
            }
            
            const user = localStorage.getItem('user');
            const userAvatarEl = document.getElementById('user-avatar');
            const logoutBtn = document.getElementById('logout-btn');
            const profileBtn = document.getElementById('user-avatar');
            
            if(!user) {
                document.getElementById('user-display').textContent = 'Guest';
                profileBtn.style.display = 'none';
                logoutBtn.textContent = 'Login';
                logoutBtn.removeAttribute('data-i18n'); // Remove data-i18n so translations don't override it to 'Logout'
                logoutBtn.addEventListener('click', () => {
                    window.location.href = '/login';
                });
            } else {
                document.getElementById('user-display').textContent = user;
                
                const localAvatar = localStorage.getItem('avatar');
                if (localAvatar) {
                    userAvatarEl.src = 'avatars/' + localAvatar;
                    userAvatarEl.style.display = 'block';
                }
                
                logoutBtn.addEventListener('click', () => {
                    if(confirm('Are you sure you want to logout?')) {
                        localStorage.removeItem('user');
                        localStorage.removeItem('avatar');
                        window.location.href = '/login';
                    }
                });
            }
            
            document.getElementById('save-tier-list-btn').addEventListener('click', () => {
                const container = document.querySelector('.tier-list-container');
                const btn = document.getElementById('save-tier-list-btn');
                const originalText = btn.textContent;
                btn.textContent = '⏳ Saving...';
                
                html2canvas(container, {
                    backgroundColor: '#1a1a1a',
                    scale: 2
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'my-hero-wars-tier-list.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    btn.textContent = originalText;
                }).catch(err => {
                    console.error('Error saving tier list:', err);
                    alert('Oops! Something went wrong while saving.');
                    btn.textContent = originalText;
                });
            });
        });
    </script>
