<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titans Tier List Maker - Trade Boy</title>
    <link rel="stylesheet" href="home.css">
    <script src="translations.js"></script>
    <!-- Include SortableJS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .page-header {
            text-align: center;
            margin-top: 100px;
            margin-bottom: 20px;
            color: #fff;
        }
        .page-description {
            text-align: center;
            color: #aaa;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .tier-list-container {
            max-width: 1000px;
            margin: 0 auto 40px auto;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .tier-row {
            display: flex;
            min-height: 100px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .tier-row:last-child {
            border-bottom: none;
        }
        
        .tier-label {
            width: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: 900;
            color: #111;
            text-shadow: 0px 1px 1px rgba(255,255,255,0.4);
        }
        .tier-label.s { background-color: #ff7f7f; }
        .tier-label.a { background-color: #ffbf7f; }
        .tier-label.b { background-color: #ffff7f; }
        .tier-label.c { background-color: #7fff7f; }
        .tier-label.d { background-color: #7fbfff; }
        
        .tier-dropzone {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            min-height: 100px;
        }
        
        .hero-icon {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.2);
            cursor: grab;
            transition: transform 0.1s;
            user-select: none;
            background: #222;
        }
        .hero-icon:active {
            cursor: grabbing;
        }
        .hero-icon:hover {
            border-color: #aef649;
            transform: scale(1.05);
        }
        .hero-icon.sortable-ghost {
            opacity: 0.4;
            transform: scale(0.95);
        }
        
        .save-btn-container {
            text-align: center;
            margin-bottom: 40px;
        }
        .save-btn {
            background: linear-gradient(135deg, #aef649, #8bd032);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(174, 246, 73, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(174, 246, 73, 0.6);
        }
        .save-btn:active {
            transform: translateY(1px);
        }
        
        .hero-pool-container {
            max-width: 1000px;
            margin: 0 auto 60px auto;
            text-align: center;
        }
        .hero-pool-title {
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 15px;
        }
        .hero-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            min-height: 150px;
            justify-content: center;
            align-items: center;
        }
    </style>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7790482039975365" crossorigin="anonymous"></script>
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Titan Tier List - Trade Boy" />
    <meta property="og:description" content="Your ultimate Hero Wars companion for real-time Draft Battles, Team Builds, and Tier Lists." />
    <meta property="og:image" content="https://trade-boy.onrender.com/titans.jpg" />
    <meta property="og:url" content="https://trade-boy.onrender.com/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#aef649" />
</head>
<body>
    <nav class="top-nav">
        <a href="/" class="logo-container" style="text-decoration: none;">
            <img src="logo.jpg" alt="Trade Boy Logo" class="logo-img">
            <span class="logo" style="display: flex; align-items: center; gap: 8px;">Trade Boy 
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#aef649" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" title="Home">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </span>
        </a>
        <div style="display: flex; align-items: center; gap: 25px;">
            <div class="lang-menu-container" style="position: relative;">
                <button class="nav-icon-btn" onclick="const m = document.getElementById('lang-dropdown'); m.style.display = m.style.display === 'none' ? 'block' : 'none';" data-i18n="lang_en">
                    EN <span style="font-size: 1.2em; margin-top: -2px;">🌐</span>
                </button>
                <div id="lang-dropdown" class="lang-dropdown">
                    <div class="lang-option active" onclick="selectLanguage(this, 'EN')">🇺🇸 English</div>
                    <div class="lang-option" onclick="selectLanguage(this, 'ID')">🇮🇩 Indonesia</div>
                    <div class="lang-option" onclick="selectLanguage(this, 'RU')">🇷🇺 Русский</div>
                </div>
            </div>
            <div id="user-info" style="display: flex; align-items: center; gap: 15px;">
                <span id="user-display" style="font-weight: bold; color: #aef649;"></span>
                <img id="user-avatar" src="" alt="Avatar" style="width: 40px; height: 40px; border-radius: 50%; display: none; border: 2px solid #aef649; cursor: pointer;">
                <button id="logout-btn" class="nav-icon-btn" style="padding: 6px 15px; font-size: 0.8rem;" data-i18n="logout">Logout</button>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div style="max-width: 1000px; margin: 0 auto; padding-top: 20px;">
            <a href="/" style="color: #aef649; text-decoration: none; font-weight: bold; font-size: 1.1rem; display: inline-block; margin-bottom: 20px; transition: color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#aef649'">&larr; Back to Home</a>
        </div>
        <h1 class="page-header">Titans Tier List Maker</h1>
        <p class="page-description">Drag and drop the titans from the pool below to create your very own ultimate Hero Wars tier list.</p>
        
        <div class="tier-list-container">
            <div class="tier-row">
                <div class="tier-label s">S</div>
                <div class="tier-dropzone" id="tier-s"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label a">A</div>
                <div class="tier-dropzone" id="tier-a"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label b">B</div>
                <div class="tier-dropzone" id="tier-b"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label c">C</div>
                <div class="tier-dropzone" id="tier-c"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label d">D</div>
                <div class="tier-dropzone" id="tier-d"></div>
            </div>
        </div>

        <div class="save-btn-container">
            <button id="save-tier-list-btn" class="save-btn">💾 Save Tier List as Image</button>
        </div>

        <div class="hero-pool-container">
            <h2 class="hero-pool-title">Titan Pool</h2>
            <div class="hero-pool" id="hero-pool">
                <img src="titans/alecto.png" class="hero-icon" alt="alecto" title="alecto">
                <img src="titans/Amon.png" class="hero-icon" alt="Amon" title="Amon">
                <img src="titans/Angus.png" class="hero-icon" alt="Angus" title="Angus">
                <img src="titans/Araji.png" class="hero-icon" alt="Araji" title="Araji">
                <img src="titans/Asherona.png" class="hero-icon" alt="Asherona" title="Asherona">
                <img src="titans/Avalon.png" class="hero-icon" alt="Avalon" title="Avalon">
                <img src="titans/Bruster.png" class="hero-icon" alt="Bruster" title="Bruster">
                <img src="titans/Eden.png" class="hero-icon" alt="Eden" title="Eden">
                <img src="titans/Hyperion.png" class="hero-icon" alt="Hyperion" title="Hyperion">
                <img src="titans/Ignis.png" class="hero-icon" alt="Ignis" title="Ignis">
                <img src="titans/Iyari.png" class="hero-icon" alt="Iyari" title="Iyari">
                <img src="titans/Keros.png" class="hero-icon" alt="Keros" title="Keros">
                <img src="titans/Lumira.png" class="hero-icon" alt="Lumira" title="Lumira">
                <img src="titans/Mairi.png" class="hero-icon" alt="Mairi" title="Mairi">
                <img src="titans/Moloch.png" class="hero-icon" alt="Moloch" title="Moloch">
                <img src="titans/Mort.png" class="hero-icon" alt="Mort" title="Mort">
                <img src="titans/Nova.png" class="hero-icon" alt="Nova" title="Nova">
                <img src="titans/Rigel.png" class="hero-icon" alt="Rigel" title="Rigel">
                <img src="titans/Sigurd.png" class="hero-icon" alt="Sigurd" title="Sigurd">
                <img src="titans/Solaris.png" class="hero-icon" alt="Solaris" title="Solaris">
                <img src="titans/Syvla.png" class="hero-icon" alt="Syvla" title="Syvla">
                <img src="titans/Tenebris.png" class="hero-icon" alt="Tenebris" title="Tenebris">
                <img src="titans/Tidus.png" class="hero-icon" alt="Tidus" title="Tidus">
                <img src="titans/Umbra.png" class="hero-icon" alt="Umbra" title="Umbra">
                <img src="titans/valdur-and-echo.png" class="hero-icon" alt="valdur-and-echo" title="valdur-and-echo">
                <img src="titans/Verdoc.png" class="hero-icon" alt="Verdoc" title="Verdoc">
                <img src="titans/Vulcan.png" class="hero-icon" alt="Vulcan" title="Vulcan">
            </div>
        </div>
    </main>

    
    
    <script>
        // SortableJS Initialization for Drag and Drop
        document.addEventListener('DOMContentLoaded', () => {
            const dropzones = document.querySelectorAll('.tier-dropzone, .hero-pool');
            
            dropzones.forEach(zone => {
                new Sortable(zone, {
                    group: 'shared', // set both lists to same group so items can move between them
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    easing: "cubic-bezier(1, 0, 0, 1)"
                });
            });
        });

        // Navigation and Auth Logic
        document.addEventListener('click', (e) => {
            const container = document.querySelector('.lang-menu-container');
            const menu = document.getElementById('lang-dropdown');
            if (container && menu && !container.contains(e.target)) {
                menu.style.display = 'none';
            }
        });
        
        function selectLanguage(element, langCode) {
            const btn = element.closest('.lang-menu-container').querySelector('.nav-icon-btn');
            btn.innerHTML = langCode + ' <span style="font-size: 1.2em; margin-top: -2px;">🌐</span>';
            const options = element.parentElement.querySelectorAll('.lang-option');
            options.forEach(opt => opt.classList.remove('active'));
            element.classList.add('active');
            localStorage.setItem('selectedLang', langCode);
            element.parentElement.style.display = 'none';
            if (window.applyTranslations) window.applyTranslations(langCode);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('selectedLang') || 'EN';
            const option = Array.from(document.querySelectorAll('.lang-option')).find(o => o.textContent.includes(savedLang));
            if (option) {
                selectLanguage(option, savedLang);
            }
            
            const user = localStorage.getItem('user');
            const userAvatarEl = document.getElementById('user-avatar');
            const logoutBtn = document.getElementById('logout-btn');
            const profileBtn = document.getElementById('user-avatar');
            
            if(!user) {
                document.getElementById('user-display').textContent = 'Guest';
                profileBtn.style.display = 'none';
                logoutBtn.textContent = 'Login';
                logoutBtn.removeAttribute('data-i18n'); // Remove data-i18n so translations don't override it to 'Logout'
                logoutBtn.addEventListener('click', () => {
                    window.location.href = '/login';
                });
            } else {
                document.getElementById('user-display').textContent = user;
                
                const localAvatar = localStorage.getItem('avatar');
                if (localAvatar) {
                    userAvatarEl.src = 'avatars/' + localAvatar;
                    userAvatarEl.style.display = 'block';
                }
                
                logoutBtn.addEventListener('click', () => {
                    if(confirm('Are you sure you want to logout?')) {
                        localStorage.removeItem('user');
                        localStorage.removeItem('avatar');
                        window.location.href = '/login';
                    }
                });
            }
            
            document.getElementById('save-tier-list-btn').addEventListener('click', () => {
                const container = document.querySelector('.tier-list-container');
                const btn = document.getElementById('save-tier-list-btn');
                const originalText = btn.textContent;
                btn.textContent = '⏳ Saving...';
                
                html2canvas(container, {
                    backgroundColor: '#1a1a1a',
                    scale: 2
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'my-hero-wars-titans-tier-list.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    btn.textContent = originalText;
                }).catch(err => {
                    console.error('Error saving tier list:', err);
                    alert('Oops! Something went wrong while saving.');
                    btn.textContent = originalText;
                });
            });
        });
    </script>
<script src="hero-framer.js"></script>
</body>
</html>
