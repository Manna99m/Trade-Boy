<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Details</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="team-build.css">
</head>
<body>
    <nav class="top-nav">
        <a href="index.html" class="logo-container">
            <img src="logo.jpg" alt="Trade Boy Logo" class="logo-img">
            <span class="logo">Trade Boy</span>
        </a>
        <div class="search-container">
            <input type="text" class="search-bar" placeholder="Search guides, heroes, teams...">
        </div>
        <div class="profile-container">
            <span id="user-display"></span>
            <button class="logout-btn" id="logout-btn">Logout</button>
        </div>
    </nav>

    <main class="main-content">
        <a href="index.html" class="hero-btn" style="margin-bottom: 20px;">&larr; Back to Home</a>
        
        <div class="post-detail" id="post-content">
            <!-- Content generated by JS -->
        </div>
    </main>

    <script>
        const user = localStorage.getItem('user');
        if (!user) {
            window.location.href = '/';
        }
        document.getElementById('user-display').textContent = user;
        
        document.getElementById('logout-btn').addEventListener('click', () => {
            if(confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('user');
                window.location.href = '/';
            }
        });

        // Simple mock data for posts
        const postData = {
            'archdemon-teams': { title: 'Archdemon Teams', img: 'archdemon-fight.webp', content: 'Detailed strategy on how to defeat the Archdemon. Focus on high single-target DPS and sustained healing.' },
            'event-teams': { title: 'Event Teams', img: 'event-teams.jpg', content: "For this week's event, you should prioritize heroes with crowd control and area-of-effect damage." },
            'team-build': { title: 'Team Build', img: 'team-build.jpg', content: 'A balanced team usually consists of 1 Tank, 2 DPS, 1 Support, and 1 Healer. Learn the nuances of synergy here.' },
            'heroes': { title: 'Heroes Tier List', img: 'heroes.jpg', content: 'S-Tier: ... A-Tier: ... B-Tier: ... (Placeholder details for hero analysis).' },
            'titans': { title: 'Titans Guide', img: 'titans.jpg', content: 'Upgrading your titans is crucial for Guild Wars. Focus on the Water and Fire titans first for maximum impact.' },
            'maestro-teams': { title: 'Best Team for Maestro', img: 'maestro-teams.webp', content: 'Strategies and team comps for Maestro are being compiled. Stay tuned.' },
            'osh-teams': { 
                title: 'Best Team for OSH', 
                img: 'osh-teams.png',
                content: `
                <p style="margin-bottom: 20px;">Here is the top performing team composition against OSH:</p>
                <div class="selected-slots" style="background: rgba(0,0,0,0.4); padding: 20px; border-radius: 10px; border: 1px solid #b8860b;">
                    <div class="slot pet-slot"><img src="pets/Khorus.png"></div>
                    <div class="slot hero-slot">
                        <img src="heroes/isaac.png">
                        <div class="patron-badge"><img src="pets/Oliver.png"></div>
                    </div>
                    <div class="slot hero-slot">
                        <img src="heroes/Nebula.png">
                        <div class="patron-badge"><img src="pets/Cain.png"></div>
                    </div>
                    <div class="slot hero-slot">
                        <img src="heroes/Sebastian.png">
                        <div class="patron-badge"><img src="pets/Albus.png"></div>
                    </div>
                    <div class="slot hero-slot">
                        <img src="heroes/Cornelious.png">
                        <div class="patron-badge"><img src="pets/Biscuit.png"></div>
                    </div>
                    <div class="slot hero-slot">
                        <img src="heroes/Martha.png">
                        <div class="patron-badge"><img src="pets/Axel.png"></div>
                    </div>
                </div>
                <p style="margin-top: 20px;"><em>I will add other teams later...</em></p>
                `
            },
            'draft-battle': {
                title: 'Draft Battle',
                content: 'Draft Battle mode requires adapting your team on the fly. Focus on versatile heroes and synergistic counter-picks.'
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        
        const container = document.getElementById('post-content');
        
        if (postId && postData[postId]) {
            const post = postData[postId];
            document.title = `${post.title} - Trade Boy`;
            
            container.innerHTML = `
                <img src="${post.img || 'thumbnail.jpg'}" alt="${post.title}" class="post-header-img">
                <h1 style="margin-bottom: 20px; font-size: 2.5rem;">${post.title}</h1>
                <div style="font-size: 1.1rem; line-height: 1.8; color: #cbd5e1;">${post.content}</div>
                <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
                    <p style="color: #94a3b8;">Written by: Trade Boy</p>
                </div>
            `;
        } else {
            container.innerHTML = `
                <h1>Post not found</h1>
                <p>The post you are looking for does not exist.</p>
            `;
        }
    </script>
</body>
</html>
