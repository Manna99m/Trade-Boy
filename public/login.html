<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Boy - Login</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7790482039975365" crossorigin="anonymous"></script>
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Trade Boy - Hero Wars Guide" />
    <meta property="og:description" content="Your ultimate Hero Wars companion for real-time Draft Battles, Team Builds, and Tier Lists." />
    <meta property="og:image" content="https://trade-boy.onrender.com/logo.jpg" />
    <meta property="og:url" content="https://trade-boy.onrender.com/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#aef649" />
</head>
<body>
    <div class="background"></div>
    <div class="login-container">
        <h2 id="form-title">Login</h2>
        <form id="auth-form">
            <div class="input-group">
                <input type="text" id="username" placeholder="Username" required>
                <span class="icon">👤</span>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
                <span class="icon">🔒</span>
            </div>
            
            <div id="avatar-picker-container" style="display: none; margin: 15px 0;">
                <p style="color: #ccc; margin-bottom: 10px; font-size: 0.85rem; text-align: left;">Choose an Avatar (Optional)</p>
                <div class="avatar-grid" id="avatar-grid">
                    <!-- Avatars will be injected by JS -->
                </div>
            </div>
            
            <div class="options" id="login-options">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" id="submit-btn">Login</button>
            <p class="error-msg" id="error-msg"></p>
            
            <p class="toggle-text">
                <span id="toggle-msg">Don't have an account?</span> 
                <a href="#" id="toggle-link">Register</a>
            </p>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
